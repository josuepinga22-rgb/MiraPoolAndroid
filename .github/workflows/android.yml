
name: Gerar APK Mira Pool

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          unzip -o MiraPoolAndroid_projeto.zip -d projeto
          echo "sdk.dir=$ANDROID_HOME" > projeto/local.properties

      - name: Compilar APK
        run: |
          cd projeto
          gradle assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiraPool-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          
